name: Refresh MiCA data
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/fetch_mica.py", ".github/workflows/refresh-mica.yml"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_mica.py
      - name: Commit if changed
        run: |
          git config user.name "mica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mica.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh MiCA register data" && git push; fi
