name: Refresh events data
on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["scripts/fetch_events.py", ".github/workflows/refresh-events.yml"]
permissions:
  contents: write
  issues: write
concurrency: refresh-events
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch events
        id: fetch
        run: python scripts/fetch_events.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh events data"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 10; done
          exit 1
      - name: Fail if any register failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
      - name: Open issue on failure
        if: failure() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Events data refresh failing";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "events-refresh-failure" });
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nSources that failed keep their last good events; the others still updated.`;
            if (open.data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["events-refresh-failure"] });
      - name: Close failure issue on success
        if: success() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "events-refresh-failure" });
            for (const i of open.data) await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
