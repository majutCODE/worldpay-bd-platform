name: Detect payment providers
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["scripts/detect_psp.py", ".github/workflows/refresh-psp.yml"]
permissions:
  contents: write
  issues: write
concurrency: refresh-psp
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan B2C websites
        id: scan
        run: python scripts/detect_psp.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "psp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/psp.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh payment provider detection"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 10; done
          exit 1
      - name: Fail if scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
      - name: Open issue on failure
        if: failure() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Payment provider detection failing";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "psp-refresh-failure" });
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nThe site keeps showing the last good detection.`;
            if (open.data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["psp-refresh-failure"] });
      - name: Close failure issue on success
        if: success() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "psp-refresh-failure" });
            for (const i of open.data) await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
